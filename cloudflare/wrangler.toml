name = "talk-to-the-bible-api"
main = "worker.mjs"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
OPENROUTER_MODEL = "openai/gpt-4.1"
OPENROUTER_FALLBACK_MODEL = "openai/gpt-4.1-mini"
OPENROUTER_MAX_TOKENS = "700"
OPENROUTER_TIMEOUT_MS = "6000"
OPENROUTER_SITE_URL = "https://thewayversion.com"
OPENROUTER_SITE_NAME = "Talk To The Bible"
OPENROUTER_TRANSLATION_MODEL = "openai/gpt-4.1-mini"
ALLOWED_ORIGINS = "*"
TEST_PREMIUM_CODE = "385"
MAX_DAILY_REQUESTS = "20"
PLUS_DAILY_REQUESTS = "1000"
THE_WAY_BASE_URL = "https://thewayversion.com"
KJV_API_BASE_URL = "https://bible-api.com"
MULTILINGUAL_BIBLE_BASE_URL = "https://api.midvash.com"
SQUARE_PLAN_NAME = "Talk To The Bible Plus"
SQUARE_PLAN_PRICE_MINOR = "499"
SQUARE_PLAN_CURRENCY = "USD"
PUBLIC_BILLING_SITE_URL = "https://thewayversion.com"
SQUARE_APPLICATION_ID = "sq0idp-LiZZjiZZiX6WXE4X8P_fFw"
SQUARE_LOCATION_ID = "LJ8MN6PD32KY1"
KDROP_BILLING_BRIDGE_URL = "https://kdrop.skin/api/internal/talk-to-the-bible"

# Run `wrangler d1 create talk-to-the-bible-db`, then replace the placeholder
# below before the first deploy. The OpenRouter key is a Worker secret, not a
# value in this file: `wrangler secret put OPENROUTER_API_KEY`.
[[d1_databases]]
binding = "BIBLE_DB"
database_name = "talk-to-the-bible-db"
database_id = "07dd9d32-bead-4b03-a522-867a01762366"
migrations_dir = "migrations"
